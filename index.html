<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>경영학부 졸업시험 CBT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F4;--paper:#FFFFFF;--ink:#1C2130;--muted:#5E6577;--line:#D9DDE5;
  --omr:#C92D55;--omr-soft:#FBE8EE;--ok:#177A55;--ok-soft:#E1F2EA;--bad:#C4304F;--bad-soft:#FBE4E9;
  --note:#8A5A00;--note-soft:#FFF4DA;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13151B;--paper:#1C1F28;--ink:#E7E9EF;--muted:#9AA1B2;--line:#2D3240;
  --omr:#F0708F;--omr-soft:#3A1F29;--ok:#52C99A;--ok-soft:#16322A;--bad:#F27A93;--bad-soft:#3B1D25;
  --note:#F2C46B;--note-soft:#352B14;}}
:root[data-theme="dark"]{
  --bg:#13151B;--paper:#1C1F28;--ink:#E7E9EF;--muted:#9AA1B2;--line:#2D3240;
  --omr:#F0708F;--omr-soft:#3A1F29;--ok:#52C99A;--ok-soft:#16322A;--bad:#F27A93;--bad-soft:#3B1D25;
  --note:#F2C46B;--note-soft:#352B14;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;word-break:keep-all;overflow-wrap:anywhere;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;min-height:100vh}
button{font:inherit;color:inherit}
img{max-width:100%}
:focus-visible{outline:2px solid var(--omr);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
[hidden]{display:none!important}

/* ---------- home ---------- */
.masthead{padding:28px 0 18px}
.masthead h1{font-size:28px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em}
.masthead p{margin:6px 0 0;color:var(--muted);font-size:14px}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
.sheet::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;
  background:repeating-linear-gradient(to bottom,var(--ink) 0 6px,transparent 6px 22px);opacity:.85}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;padding:12px 16px 10px 26px;border-bottom:2px solid var(--omr);color:var(--omr);font-size:13px;font-weight:600}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--line);padding:14px 16px 14px 26px;cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--omr-soft)}
.row .name{font-size:17px;font-weight:600}
.row .en{font-size:13px;color:var(--muted);font-weight:400;margin-left:6px}
.row .count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.row .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--ok)}.bar .b-bad{background:var(--bad)}
.row .meta{grid-column:1/-1;display:flex;gap:10px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .meta b{font-weight:600}
.row .meta .w{color:var(--bad)}
.row.total .name{color:var(--omr)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 2px 36px;font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}

/* ---------- quiz ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:8px;height:52px}
.iconbtn{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:8px 6px;cursor:pointer;font-size:15px;font-weight:500}
.iconbtn svg{width:20px;height:20px}
.topbar .title{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.omrbtn{border:1.5px solid var(--omr);color:var(--omr);border-radius:8px;padding:5px 10px;background:none;font-weight:600;font-size:13px;cursor:pointer}
.progress{height:3px;background:var(--line)}
.progress i{display:block;height:100%;background:var(--omr);transition:width .2s}
main.quiz{padding:16px 0 120px}
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 18px 8px}
.qlabel{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--omr);font-weight:600;margin-bottom:10px}
.qlabel .src{color:var(--muted);font-weight:500}
.stem{word-break:normal;overflow-wrap:break-word;font-family:var(--serif);font-size:17.5px;line-height:1.62;max-width:68ch}
.stem p{margin:0 0 10px}
.stem.intro{font-size:15.5px;color:var(--muted);border-bottom:1px dashed var(--line);margin-bottom:12px;padding-bottom:2px}
.stem .li{margin:0 0 4px;padding-left:4px}
.stem .case{border-left:3px solid var(--omr);padding:6px 0 6px 12px;margin:4px 0 12px;background:var(--omr-soft);border-radius:0 6px 6px 0}
.figure{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;margin:0 0 12px;overflow-x:auto}
.figure img{display:block;max-width:100%;height:auto;margin:0 auto}
.figure.zoom img{max-width:none}
.figure-tools{display:flex;justify-content:flex-end;margin:-6px 0 10px}
.opts{list-style:none;margin:6px 0 10px;padding:0}
.opt{word-break:normal;overflow-wrap:break-word;width:100%;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;text-align:left;
  background:none;border:1px solid transparent;border-radius:10px;padding:10px 8px;cursor:pointer;font-family:var(--serif);font-size:16.5px;line-height:1.5}
.opt:hover:not([disabled]){background:var(--omr-soft)}
.opt[disabled]{cursor:default}
.bub{width:30px;height:30px;border-radius:50%;border:1.6px solid var(--omr);color:var(--omr);display:grid;place-items:center;
  font-family:var(--sans);font-weight:600;font-size:14px;margin-top:-3px;transition:background .15s,color .15s}
.opt.is-ans{background:var(--ok-soft);border-color:var(--ok)}
.opt.is-ans .bub{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.is-wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.is-wrong .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.verdict{display:flex;align-items:center;gap:10px;border-radius:10px;padding:12px 14px;margin:4px 0 12px;font-weight:600}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict svg{width:22px;height:22px;flex:none}
.note{background:var(--note-soft);color:var(--note);border-radius:10px;padding:10px 14px;margin:0 0 12px;font-size:14px;line-height:1.5}
.note b{font-weight:600}
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.navbar .wrap{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;padding-top:10px;padding-bottom:10px}
.btn{border-radius:10px;padding:13px 14px;font-weight:600;font-size:15.5px;cursor:pointer;border:1.5px solid var(--line);background:var(--paper)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:default}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:12px}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,12,18,.45);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--paper);width:100%;max-width:720px;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
@media (min-width:760px){.scrim{align-items:center}.panel{border-radius:18px;max-width:560px}}
.panel h2{margin:0 0 4px;font-size:20px}
.panel .sub{margin:0 0 16px;color:var(--muted);font-size:14px}
.choice{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:14px 16px;margin:0 0 10px;cursor:pointer}
.choice:hover:not([disabled]){border-color:var(--omr)}
.choice[disabled]{opacity:.45;cursor:default}
.choice strong{display:block;font-size:16px;font-weight:600}
.choice span{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.choice.main{border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;margin:8px 0 16px}
.cell{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--omr);color:var(--omr);background:none;font-size:13px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums;display:grid;place-items:center}
.cell.ok{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.cell.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.cell.cur{box-shadow:0 0 0 3px var(--omr-soft),0 0 0 5px var(--omr)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:5px;border:1.5px solid var(--omr)}
.legend .l-ok{background:var(--ink);border-color:var(--ink)}.legend .l-bad{background:var(--bad);border-color:var(--bad)}

/* ---------- result ---------- */
.result{padding:40px 0 60px;text-align:center}
.score{font-size:64px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;margin:10px 0}
.score small{font-size:24px;color:var(--muted);font-weight:500}
.result p{color:var(--muted);margin:6px 0 24px}
.result .btn{display:block;width:100%;max-width:360px;margin:0 auto 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="home">
  <div class="wrap">
    <header class="masthead">
      <h1>경영학부 졸업시험 CBT</h1>
      <p>26학년도 2학기 문제은행 322문항</p>
    </header>
    <section class="sheet" aria-label="챕터 목록">
      <div class="sheet-head"><span>과목</span><span>풀이 / 문항</span></div>
      <div id="rows"></div>
    </section>
    <div class="foot">
      <span>기록은 이 기기의 브라우저에 저장돼요.</span>
      <button class="linkbtn" id="resetAll">기록 초기화</button>
    </div>
  </div>
</div>

<div id="quiz" hidden>
  <div class="topbar">
    <div class="wrap">
      <button class="iconbtn" id="backBtn" aria-label="목록으로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>목록</button>
      <div class="title" id="qTitle"></div>
      <span class="pos" id="qPos"></span>
      <button class="omrbtn" id="omrBtn">답안지</button>
    </div>
    <div class="progress"><i id="qProg"></i></div>
  </div>
  <main class="quiz">
    <div class="wrap">
      <article class="qcard" id="qcard"></article>
      <p class="hint" id="kbdHint">키보드: 1–5 또는 A–E로 선택, ← → 로 이동</p>
    </div>
  </main>
  <nav class="navbar">
    <div class="wrap">
      <button class="btn" id="prevBtn">이전</button>
      <button class="btn primary" id="nextBtn">다음 문제</button>
    </div>
  </nav>
</div>

<div id="result" hidden>
  <div class="wrap result">
    <div id="resTitle" style="font-weight:600"></div>
    <div class="score" id="resScore"></div>
    <p id="resSub"></p>
    <button class="btn primary" id="resWrong">이번에 틀린 문제 다시 풀기</button>
    <button class="btn" id="resReview">답안지 다시 보기</button>
    <button class="btn" id="resHome">목록으로</button>
  </div>
</div>

<div class="scrim" id="modeScrim" hidden><div class="panel" role="dialog" aria-modal="true" aria-labelledby="modeTitle" id="modePanel"></div></div>
<div class="scrim" id="omrScrim" hidden><div class="panel" role="dialog" aria-modal="true" aria-labelledby="omrTitle" id="omrPanel"></div></div>

entory, leaving undamaged inventory with a cost of $3,000. Using the gross profit method, the estimated ending inventory destroyed by fire is"}], "o": [["A", "$17,000"], ["B", "$77,000"], ["C", "$80,000"], ["D", "$58,000"]], "a": "A"}, {"s": "Accounting", "n": 13, "t": [{"k": "p", "t": "Wilson Co. purchased land as a factory site for $600,000. Wilson paid $60,000 to tear down two buildings on the land. Salvage was sold for $5,400. Legal fees of $3,480 were paid for title investigation and making the purchase. Architect's fees were $31,200. Title insurance cost $2,400, and liability insurance during construction cost $2,600. Excavation cost $10,440. The contractor was paid $2,200,000. An assessment made by the city for pavement was $6,400. Interest costs during construction were $170,000. The cost of the land that should be recorded by Wilson Co. is"}], "o": [["A", "$660,480"], ["B", "$666,880"], ["C", "$669,880"], ["D", "$676,280"]], "a": "B"}, {"s": "Accounting", "n": 14, "t": [{"k": "p", "t": "Lee Company received an HK$1,800,000 subsidy from the government to purchase manufacturing equipment on January, 2, 2015. The equipment has a cost of HK$3,000,000, a useful life a six years, and no salvage value. Lee depreciates the equipment on a straight-line basis. If Lee chooses to account for the grant as deferred revenue, the grant revenue recognized will be:"}], "o": [["A", "Zero in the first year of the grant's life."], ["B", "HK$300,000 per year for the years 2015-2020."], ["C", "HK$500,000 per year for the years 2015-2020."], ["D", "HK$1,800,000 in 2015."]], "a": "B"}, {"s": "Accounting", "n": 15, "t": [{"k": "p", "t": "Rivera Company purchased a tooling machine on January 3, 2008 for $500,000. The machine was being depreciated on the straight-line method over an estimated useful life of 10 years, with no residual value. At the beginning of 2015, the company paid $125,000 to overhaul the machine. As a result of this improvement, the company estimated that the usefu cur, will always have a positive NPV and therefore should always be accepted."]], "a": "C"}, {"s": "Financial Management", "n": 6, "t": [{"k": "p", "t": "All else constant, the net present value of a typical investment project increases when:"}], "o": [["A", "the discount rate increases."], ["B", "each cash inflow is delayed by one year."], ["C", "the initial cost of a project increases."], ["D", "the rate of return decreases."]], "a": "D"}, {"s": "Financial Management", "n": 7, "t": [{"k": "p", "t": "Given that the net present value (NPV) is generally considered to be the best method of analysis, why should you still use the other methods?"}], "o": [["A", "The other methods help validate whether or not the results from the net present value analysis are reliable."], ["B", "You need to use the other methods since conventional practice dictates that you only accept projects after you have generated three accept indicators."], ["C", "You need to use other methods because the net present value method is unreliable when a project has unconventional cash flows."], ["D", "The internal rate of return must always indicate acceptance since this is the best method from a financial perspective."]], "a": "A"}, {"s": "Financial Management", "n": 8, "t": [{"k": "p", "t": "The cash flow tax savings generated as a result of a firm's tax-deductible depreciation expense is called the:"}], "o": [["A", "after-tax depreciation savings."], ["B", "depreciable basis."], ["C", "depreciation tax shield."], ["D", "operating cash flow."]], "a": "C"}, {"s": "Financial Management", "n": 9, "t": [{"k": "p", "t": "The cash flow from projects for a company is computed as the:"}], "o": [["A", "net operating cash flow generated by the project, less any sunk costs and erosion costs."], ["B", "sum of the incremental operating cash flow and after-tax salvage value of the project."], ["C", "net income generated by the project, plus the annual depreciation expense."], ["D", "sum of the incremental operati <script>
(function(){
const RAW = JSON.parse(document.getElementById('bank').textContent);
const SECS = [
  {k:'acc',en:'Accounting',ko:'회계'},
  {k:'fin',en:'Financial Management',ko:'재무관리'},
  {k:'mkt',en:'Marketing',ko:'마케팅'},
  {k:'mis',en:'Management Information System',ko:'경영정보시스템',short:'MIS'},
  {k:'ms',en:'Management Science',ko:'관리과학'},
  {k:'sm',en:'Strategic Management',ko:'전략경영'},
  {k:'ob',en:'Organizational Behavior',ko:'조직행동'}
];
const byEn = Object.fromEntries(SECS.map(s=>[s.en,s]));
const Q = {}; const ORDER = []; const SEC_IDS = {};
SECS.forEach(s=>SEC_IDS[s.k]=[]);
RAW.q.forEach(q=>{
  const s = byEn[q.s]; const id = s.k+'-'+q.n;
  q.id = id; q.sk = s.k; Q[id]=q; ORDER.push(id); SEC_IDS[s.k].push(id);
});

/* ---------- storage ---------- */
const KEY='cau-grad-cbt-v1';
let S = {hist:{}, sess:{}};
try{ const t = localStorage.getItem(KEY); if(t){ const p=JSON.parse(t); if(p&&p.hist&&p.sess) S=p; } }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const $ = s=>document.getElementById(s);
function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const isOk = (id,ch)=> ch && ch.toUpperCase()===Q[id].a;
function wrongIds(scope){ return (scope==='all'?ORDER:SEC_IDS[scope]).filter(id=>S.hist[id]===0); }
function sessStats(sess){ let n=0,ok=0; if(sess) for(const id of sess.order){ const c=sess.ans[id]; if(c){ n++; if(isOk(id,c)) ok++; } } return {n,ok}; }

/* ---------- home ---------- */
function renderHome(){
  const rows=$('rows'); rows.textContent='';
  const items = SECS.map(s=>({key:s.k,name:s.ko,en:s.short||s.en,total:SEC_IDS[s.k].length}));
  items.push({key:'all',name:'전체 시험보기',en:'322문항 또는 랜덤 40',total:ORDER.length,isAll:true});
  for(const it of items){
    const b=el('button','row'+(it.isAll?' total':''));
    const nm=el('div','name',it.name); nm.appendChild(el('span','en',it.en)); b.appendChild(nm);
    const sess = it.isAll? S.sess['all'] : S.sess[it.key];
    const st = sessStats(sess);
    b.appendChild(el('div','count',st.n+' / '+it.total));
    const bar=el('div','bar'); const okw=st.ok/it.total*100, badw=(st.n-st.ok)/it.total*100;
    const i1=el('i','b-ok'); i1.style.width=okw+'%'; const i2=el('i','b-bad'); i2.style.width=badw+'%';
    bar.append(i1,i2); b.appendChild(bar);
    const meta=el('div','meta');
    const w = wrongIds(it.key).length;
    const m1=el('span'); m1.innerHTML='정답 <b></b>'; m1.querySelector('b').textContent=st.ok;
    const m2=el('span','w'); m2.innerHTML='오답노트 <b></b>'; m2.querySelector('b').textContent=w;
    meta.append(m1,m2);
    if(it.isAll && S.sess['r40'] && !S.sess['r40'].done){ const m3=el('span'); m3.textContent='랜덤 40 진행 중 '+sessStats(S.sess['r40']).n+'/40'; meta.appendChild(m3); }
    b.appendChild(meta);
    b.setAttribute('aria-label', it.name+', '+st.n+'/'+it.total+' 풀이, 오답 '+w);
    b.onclick=()=>openMode(it);
    rows.appendChild(b);
  }
}

/* ---------- mode sheet ---------- */
let lastFocus=null;
function openScrim(id){ lastFocus=document.activeElement; $(id).hidden=false; const f=$(id).querySelector('button'); if(f) f.focus(); }
function closeScrim(id){ $(id).hidden=true; if(lastFocus&&lastFocus.focus) lastFocus.focus(); }
['modeScrim','omrScrim'].forEach(id=>{ $(id).addEventListener('click',e=>{ if(e.target.id===id) closeScrim(id); }); });

function choice(title, sub, fn, opts={}){
  const b=el('button','choice'+(opts.main?' main':'')); b.appendChild(el('strong',null,title)); if(sub) b.appendChild(el('span',null,sub));
  if(opts.disabled) b.disabled=true; b.onclick=()=>{ closeScrim('modeScrim'); fn(); }; return b;
}
function openMode(it){
  const p=$('modePanel'); p.textContent='';
  const h=el('h2',null,it.name); h.id='modeTitle'; p.appendChild(h);
  const scope = it.key;
  const w = wrongIds(scope);
  if(!it.isAll){
    p.appendChild(el('p','sub',it.en+', '+it.total+'문항'));
    const sess=S.sess[scope]; const st=sessStats(sess);
    if(sess && st.n>0 && st.n<it.total) p.appendChild(choice('이어서 풀기', st.n+'/'+it.total+' 풀었어요. '+(sess.idx+1)+'번째 문제부터 이어서.', ()=>go(scope), {main:true}));
    p.appendChild(choice(sess&&st.n>0?'처음부터 다시 풀기':'처음부터 풀기', sess&&st.n>0?'이 챕터의 진행 기록을 비우고 1번부터 시작해요. 오답노트는 유지돼요.':'1번부터 원문 순서대로 풀어요.', ()=>{ newSess(scope, SEC_IDS[scope].slice()); go(scope); }, {main:!(sess&&st.n>0&&st.n<it.total)}));
    if(sess && st.n===it.total) p.appendChild(choice('답안지 다시 보기','다 푼 문제와 내 답을 다시 확인해요.',()=>go(scope)));
    p.appendChild(choice('오답노트 풀기 ('+w.length+')', w.length? '가장 최근에 틀린 문제만 모아 풀어요. 맞히면 목록에서 빠져요.':'아직 틀린 문제가 없어요.', ()=>{ newSess('w-'+scope, w); go('w-'+scope); }, {disabled:!w.length}));
  } else {
    p.appendChild(el('p','sub','7개 과목 전체에서 풀어요.'));
    const r=S.sess['r40']; const rs=sessStats(r);
    if(r && !r.done && rs.n<40) p.appendChild(choice('랜덤 40문제 이어서', rs.n+'/40 풀었어요.', ()=>go('r40'), {main:true}));
    p.appendChild(choice('랜덤 40문제 실전', '322문항 중 40문항을 무작위로 뽑아요. 끝나면 점수가 나와요.', ()=>{ newSess('r40', shuffle(ORDER).slice(0,40)); go('r40'); }, {main:!(r&&!r.done&&rs.n<40)}));
    const a=S.sess['all']; const as=sessStats(a);
    if(a && as.n>0 && as.n<ORDER.length) p.appendChild(choice('322문항 순서대로 이어서', as.n+'/'+ORDER.length+' 풀었어요.', ()=>go('all')));
    p.appendChild(choice(a&&as.n>0?'322문항 처음부터 다시':'322문항 순서대로', '회계부터 조직행동까지 원문 순서대로 전부 풀어요.', ()=>{ newSess('all', ORDER.slice()); go('all'); }));
    p.appendChild(choice('전체 오답노트 ('+w.length+')', w.length? '모든 과목에서 최근에 틀린 문제만 모아 풀어요.':'아직 틀린 문제가 없어요.', ()=>{ newSess('w-all', w); go('w-all'); }, {disabled:!w.length}));
  }
  const c=el('button','linkbtn','닫기'); c.onclick=()=>closeScrim('modeScrim'); p.appendChild(c);
  openScrim('modeScrim');
}

/* ---------- sessions ---------- */
let cur=null; // session key
function newSess(key, order){ S.sess[key]={order:order, ans:{}, idx:0, done:false}; save(); }
function sessName(key){
  if(key==='r40') return '랜덤 40문제 실전';
  if(key==='all') return '전체 322문항';
  if(key.startsWith('w-')){ const k=key.slice(2); return (k==='all'?'전체':SECS.find(s=>s.k===k).ko)+' 오답노트'; }
  return SECS.find(s=>s.k===key).ko;
}
function go(key){
  cur=key; const s=S.sess[key]; if(!s){ return; }
  if(s.idx>=s.order.length) s.idx=0;
  if(key!=='r40' && !key.startsWith('w-')){ // resume at first unanswered if current answered
    if(s.ans[s.order[s.idx]]){ const k=s.order.findIndex(id=>!s.ans[id]); if(k>=0) s.idx=k; }
  }
  show('quiz'); renderQ(); window.scrollTo(0,0);
}
function show(v){ ['home','quiz','result'].forEach(x=>$(x).hidden=(x!==v)); if(v==='home') renderHome(); }

/* ---------- question ---------- */
const ICON_OK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/></svg>';
const ICON_BAD='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
function renderQ(){
  const s=S.sess[cur]; const id=s.order[s.idx]; const q=Q[id]; const sec=SECS.find(x=>x.k===q.sk);
  $('qTitle').textContent=sessName(cur);
  $('qPos').textContent=(s.idx+1)+' / '+s.order.length;
  const st=sessStats(s); $('qProg').style.width=(st.n/s.order.length*100)+'%';
  const card=$('qcard'); card.textContent='';
  const lab=el('div','qlabel'); lab.appendChild(el('span',null,sec.ko+' '+q.n+'번')); lab.appendChild(el('span','src',sec.en)); card.appendChild(lab);
  if(q.intro){ const segs=RAW.intros[q.s+'|'+q.intro]||[]; const box=el('div','stem intro');
    for(const p of segs){ if(p.k==='img') box.appendChild(fig(p.src,'공통 자료')); else box.appendChild(el('p',null,p.t)); }
    card.appendChild(box); }
  const stem=el('div','stem');
  for(const p of q.t){
    if(p.k==='img') stem.appendChild(fig(p.src, sec.en+' '+q.n+'번 자료'));
    else stem.appendChild(el('p', p.k==='li'?'li':(p.k==='case'?'case':''), p.t));
  }
  card.appendChild(stem);
  const chosen=s.ans[id]; const answered=!!chosen;
  if(answered){
    const ok=isOk(id,chosen);
    const v=el('div','verdict '+(ok?'ok':'bad')); v.innerHTML=ok?ICON_OK:ICON_BAD;
    v.appendChild(el('span',null, ok?'정답이에요':'오답이에요. 정답은 '+displayLetter(q,q.a)));
    card.appendChild(v);
  }
  const ul=el('ul','opts');
  q.o.forEach(([L,t],i)=>{
    const li=el('li'); const b=el('button','opt');
    const bub=el('span','bub',L); b.appendChild(bub); b.appendChild(el('span',null,t));
    b.setAttribute('aria-label', L+'. '+t);
    if(answered){
      b.disabled=true;
      if(L.toUpperCase()===q.a) b.classList.add('is-ans');
      else if(L===chosen) b.classList.add('is-wrong');
      else b.classList.add('dim');
    } else b.onclick=()=>answer(L);
    li.appendChild(b); ul.appendChild(li);
  });
  card.appendChild(ul);
  if(answered && q.note){ const n=el('div','note'); const bb=el('b',null,'애매한 문제 '); n.appendChild(bb); n.appendChild(document.createTextNode(q.note)); card.appendChild(n); }
  $('prevBtn').disabled = s.idx===0;
  const last = s.idx===s.order.length-1;
  $('nextBtn').textContent = last ? '결과 보기' : '다음 문제';
}
function displayLetter(q,A){ const o=q.o.find(o=>o[0].toUpperCase()===A); return o?o[0]:A; }
function fig(src,alt){
  const wrap=el('div'); const f=el('div','figure'); const im=el('img'); im.src=src; im.alt=alt; f.appendChild(im); wrap.appendChild(f);
  const tools=el('div','figure-tools'); tools.hidden=true; const z=el('button','linkbtn','크게 보기');
  z.onclick=()=>{ f.classList.toggle('zoom'); z.textContent=f.classList.contains('zoom')?'화면에 맞추기':'크게 보기'; };
  tools.appendChild(z); wrap.appendChild(tools);
  const check=()=>{ const nw=im.naturalWidth; const w=Math.max(nw/2, Math.min(nw,360)); im.style.width=w+'px'; if(w > f.clientWidth*1.15) tools.hidden=false; };
  if(im.complete) requestAnimationFrame(check); else im.onload=check;
  return wrap;
}
function answer(L){
  const s=S.sess[cur]; const id=s.order[s.idx]; if(s.ans[id]) return;
  s.ans[id]=L; S.hist[id]= isOk(id,L)?1:0; save(); renderQ();
  const v=document.querySelector('.verdict'); if(v && v.getBoundingClientRect().top<60) v.scrollIntoView({block:'center'});
}
function move(d){
  const s=S.sess[cur]; const ni=s.idx+d;
  if(ni<0) return;
  if(ni>=s.order.length){ finish(); return; }
  s.idx=ni; save(); renderQ(); window.scrollTo(0,0);
}
$('prevBtn').onclick=()=>move(-1);
$('nextBtn').onclick=()=>move(1);
$('backBtn').onclick=()=>show('home');

/* ---------- finish ---------- */
function finish(){
  const s=S.sess[cur]; const st=sessStats(s);
  const unanswered=s.order.length-st.n;
  if(unanswered>0){
    if(!confirm('아직 안 푼 문제가 '+unanswered+'개 있어요. 그래도 결과를 볼까요?')) return;
  }
  s.done=true; save();
  $('resTitle').textContent=sessName(cur);
  $('resScore').innerHTML=''; $('resScore').appendChild(document.createTextNode(st.ok)); const sm=el('small',null,' / '+s.order.length); $('resScore').appendChild(sm);
  const pct = Math.round(st.ok/s.order.length*100);
  $('resSub').textContent='정답률 '+pct+'%, 틀린 문제 '+(st.n-st.ok)+'개'+(unanswered?', 안 푼 문제 '+unanswered+'개':'');
  const wr=s.order.filter(id=>s.ans[id] && !isOk(id,s.ans[id]));
  $('resWrong').hidden=!wr.length;
  $('resWrong').onclick=()=>{ const k='w-'+(cur.startsWith('w-')?cur.slice(2):(cur==='r40'||cur==='all'?'all':cur)); newSess(k, wr); go(k); };
  $('resReview').onclick=()=>{ show('quiz'); openOmr(); };
  $('resHome').onclick=()=>show('home');
  show('result'); window.scrollTo(0,0);
}

/* ---------- OMR navigator ---------- */
function openOmr(){
  const s=S.sess[cur]; const p=$('omrPanel'); p.textContent='';
  const h=el('h2',null,'답안지'); h.id='omrTitle'; p.appendChild(h);
  const st=sessStats(s); p.appendChild(el('p','sub',sessName(cur)+', '+st.n+'/'+s.order.length+' 풀이, 정답 '+st.ok));
  const lg=el('div','legend'); lg.innerHTML='<span><i></i>안 푼 문제</span><span><i class="l-ok"></i>정답</span><span><i class="l-bad"></i>오답</span>'; p.appendChild(lg);
  const g=el('div','grid');
  s.order.forEach((id,i)=>{
    const c=s.ans[id]; const b=el('button','cell'+(c?(isOk(id,c)?' ok':' bad'):'')+(i===s.idx?' cur':''), String(i+1));
    const q=Q[id]; b.setAttribute('aria-label',(i+1)+'번째, '+SECS.find(x=>x.k===q.sk).ko+' '+q.n+'번, '+(c?(isOk(id,c)?'정답':'오답'):'안 풂'));
    b.onclick=()=>{ s.idx=i; save(); closeScrim('omrScrim'); renderQ(); window.scrollTo(0,0); };
    g.appendChild(b);
  });
  p.appendChild(g);
  const c=el('button','linkbtn','닫기'); c.onclick=()=>closeScrim('omrScrim'); p.appendChild(c);
  openScrim('omrScrim');
  const curCell=g.querySelector('.cur'); if(curCell) curCell.scrollIntoView({block:'nearest'});
}
$('omrBtn').onclick=openOmr;

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ ['modeScrim','omrScrim'].forEach(id=>{ if(!$(id).hidden) closeScrim(id); }); return; }
  if($('quiz').hidden || !$('modeScrim').hidden || !$('omrScrim').hidden) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const s=S.sess[cur]; const q=Q[s.order[s.idx]];
  let k=e.key.toUpperCase();
  if(/^[1-5]$/.test(k)) k='ABCDE'[+k-1];
  if(/^[A-E]$/.test(k)){ const o=q.o.find(o=>o[0].toUpperCase()===k); if(o && !s.ans[q.id]){ answer(o[0]); e.preventDefault(); } return; }
  if(e.key==='ArrowRight'){ move(1); e.preventDefault(); }
  if(e.key==='ArrowLeft'){ move(-1); e.preventDefault(); }
});
if(matchMedia('(hover:none)').matches) $('kbdHint').hidden=true;

$('resetAll').onclick=()=>{ if(confirm('모든 풀이 기록과 오답노트를 지울까요? 되돌릴 수 없어요.')){ S={hist:{},sess:{}}; save(); renderHome(); } };

renderHome();
})();
</script>
